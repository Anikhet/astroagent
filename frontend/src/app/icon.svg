<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AstroAgent: targeting reticle locked onto a ringed planet -->
  <rect width="64" height="64" rx="14" fill="#06120c"/>
  <!-- faint stars -->
  <circle cx="14" cy="13" r="1.6" fill="#8fd0a3" opacity="0.85"/>
  <circle cx="51" cy="18" r="1.2" fill="#8fd0a3" opacity="0.6"/>
  <circle cx="46" cy="50" r="1.4" fill="#8fd0a3" opacity="0.7"/>
  <!-- reticle -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#10b981" stroke-width="3.5"/>
  <g stroke="#10b981" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="58" y2="32"/>
  </g>
  <!-- ringed planet -->
  <circle cx="32" cy="32" r="8.5" fill="#8fd0a3"/>
  <ellipse cx="32" cy="32" rx="14.5" ry="4.5" fill="none" stroke="#10b981" stroke-width="2.5" transform="rotate(-20 32 32)"/>
</svg>
